<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="stylesheet" href="style.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Backup PostgreSQL</title>
</head>

<body>

    <div class="container">

        <h1>Backup PostgreSQL</h1>

        <p class="subtitulo">
            Gerenciamento de backup do banco de dados
        </p>

        <div class="card">

            <form id="backupForm">

                <div class="campo">
                    <label>Banco de dados</label>

                    <input
                        type="text"
                        id="banco"
                        value="bancoMatheus"
                        readonly
                    >
                </div>

                <div class="campo">
                    <label for="destination">
                        Pasta de destino do backup *
                    </label>

                    <input
                        type="text"
                        id="destination"
                        placeholder="Ex: C:\backup"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="copyDestination">
                        Pasta para cópia adicional
                    </label>

                    <input
                        type="text"
                        id="copyDestination"
                        placeholder="Opcional"
                    >
                </div>

                <div class="campo">
                    <label for="retention">
                        Quantidade de backups a manter
                    </label>

                    <input
                        type="number"
                        id="retention"
                        value="5"
                        min="1"
                    >
                </div>

                <div class="checkbox">

                    <input
                        type="checkbox"
                        id="maintenance"
                    >

                    <label for="maintenance">
                        Executar manutenção antes do backup
                    </label>

                </div>

                <div class="checkbox">

                    <input
                        type="checkbox"
                        id="fullMaintenance"
                    >

                    <label for="fullMaintenance">
                        Usar VACUUM FULL ANALYZE
                    </label>

                </div>

                <div class="checkbox">

                    <input
                        type="checkbox"
                        id="encrypt"
                    >

                    <label for="encrypt">
                        Criptografar backup (AES)
                    </label>

                </div>

                <div class="botoes">

                    <button
                        type="button"
                        id="btnTestar"
                    >
                        Testar conexão
                    </button>

                    <button
                        type="submit"
                        id="btnBackup"
                    >
                        Iniciar backup
                    </button>

                </div>

            </form>

        </div>


        <div class="card" id="resultado">

            <h2 id="resultadoTitulo">
                Resultado
            </h2>

            <pre id="resultadoConteudo"></pre>

        </div>

    </div>


    <script>

        const API_URL = "/api/backup";


        const form =
            document.getElementById("backupForm");

        const btnTestar =
            document.getElementById("btnTestar");

        const btnBackup =
            document.getElementById("btnBackup");

        const resultado =
            document.getElementById("resultado");

        const resultadoTitulo =
            document.getElementById("resultadoTitulo");

        const resultadoConteudo =
            document.getElementById("resultadoConteudo");


        /*
        ================================
        MOSTRAR RESULTADO
        ================================
        */

        function mostrarResultado(titulo, dados, sucesso) {

            resultado.style.display = "block";

            resultado.className =
                sucesso
                    ? "card sucesso"
                    : "card erro";

            resultadoTitulo.textContent = titulo;

            resultadoConteudo.textContent =
                JSON.stringify(dados, null, 2);
        }


        /*
        ================================
        TESTAR CONEXÃO
        ================================
        */

        btnTestar.addEventListener(
            "click",
            async () => {

                btnTestar.disabled = true;
                btnTestar.textContent = "Testando...";

                try {

                    const response =
                        await fetch(
                            `${API_URL}/connection`
                        );

                    const data =
                        await response.json();

                    if (response.ok) {

                        mostrarResultado(
                            "Conexão realizada com sucesso",
                            data,
                            true
                        );

                    } else {

                        mostrarResultado(
                            "Falha na conexão",
                            data,
                            false
                        );
                    }

                } catch (error) {

                    mostrarResultado(
                        "Erro de comunicação",
                        {
                            success: false,
                            error: error.message
                        },
                        false
                    );

                } finally {

                    btnTestar.disabled = false;

                    btnTestar.textContent =
                        "Testar conexão";
                }
            }
        );


        /*
        ================================
        INICIAR BACKUP
        ================================
        */

        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const destination =
                    document
                        .getElementById("destination")
                        .value
                        .trim();


                if (!destination) {

                    mostrarResultado(
                        "Erro",
                        {
                            success: false,
                            message:
                                "Informe a pasta de destino."
                        },
                        false
                    );

                    return;
                }


                /*
                ================================
                MANUTENÇÃO
                ================================
                */

                let maintenance = "NONE";

                const executarManutencao =
                    document
                        .getElementById("maintenance")
                        .checked;

                const manutencaoCompleta =
                    document
                        .getElementById("fullMaintenance")
                        .checked;


                if (executarManutencao) {

                    maintenance =
                        manutencaoCompleta
                            ? "VACUUM FULL ANALYZE"
                            : "VACUUM";
                }


                /*
                ================================
                DADOS ENVIADOS PARA O BACKEND
                ================================
                */

                const payload = {

                    destination: destination,

                    copyDestination:
                        document
                            .getElementById(
                                "copyDestination"
                            )
                            .value
                            .trim() || null,

                    retention:
                        Number(
                            document
                                .getElementById(
                                    "retention"
                                )
                                .value
                        ) || 5,

                    maintenance: maintenance,

                    encrypt:
                        document
                            .getElementById(
                                "encrypt"
                            )
                            .checked
                };


                const confirmar =
                    confirm(
                        "Deseja iniciar o backup?"
                    );


                if (!confirmar) {
                    return;
                }


                btnBackup.disabled = true;

                btnBackup.textContent =
                    "Executando backup...";


                try {

                    const response =
                        await fetch(
                            `${API_URL}/run`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        payload
                                    )
                            }
                        );


                    const data =
                        await response.json();


                    if (response.ok) {

                        mostrarResultado(
                            "Backup concluído com sucesso",
                            data,
                            true
                        );

                    } else {

                        mostrarResultado(
                            "Falha no backup",
                            data,
                            false
                        );
                    }


                } catch (error) {

                    mostrarResultado(
                        "Erro ao executar backup",
                        {
                            success: false,
                            error: error.message
                        },
                        false
                    );

                } finally {

                    btnBackup.disabled = false;

                    btnBackup.textContent =
                        "Iniciar backup";
                }
            }
        );

    </script>

</body>

</html>
